services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg18-bookworm
    container_name: apphub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apphub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apphub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-apphub}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - apphub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apphub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis cache and session store
  redis:
    image: redis:7-alpine
    container_name: apphub-redis
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Seoul
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - apphub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Python LangGraph AI service
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: apphub-ai-service
    volumes:
      - ./apps/ai-service/src:/app/src
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-apphub}:${POSTGRES_PASSWORD:-apphub_dev_password}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-apphub}
      - REDIS_URL=redis://redis:${REDIS_PORT:-6379}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-apphub}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Seoul
    ports:
      - "${AI_SERVICE_PORT:-2024}:2024"
    networks:
      - apphub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  apphub-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
