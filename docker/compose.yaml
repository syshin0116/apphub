services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: apphub-postgres
    environment:
      POSTGRES_USER: apphub
      POSTGRES_PASSWORD: apphub_dev_password
      POSTGRES_DB: apphub
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - apphub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apphub"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis cache and session store
  redis:
    image: redis:7-alpine
    container_name: apphub-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - apphub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Python LangGraph AI service
  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: apphub-ai-service
    volumes:
      - ../apps/ai-service/src:/app/src
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://apphub:apphub_dev_password@postgres:5432/apphub
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    ports:
      - "2024:2024"
    networks:
      - apphub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  apphub-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
