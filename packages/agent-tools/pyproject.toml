[project]
name = "apphub-agent-tools"
version = "0.1.0"
description = "Domain-agnostic Agent Tools with 3-tier architecture (Manus pattern)"
authors = [{ name = "AppHub Team", email = "syshin0116@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # LangChain Core (for @tool decorator)
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

# Level 2 CLI entry points (설치 시 자동으로 CLI 생성)
# [project.scripts]
# knowledge-search = "agent_tools.level2.cli.knowledge_cli:main"
# mcp-cli = "agent_tools.level2.cli.mcp_wrapper:main"

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
